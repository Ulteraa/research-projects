_BASE_: "Base-Joint-RCNN-FPN.yaml"
MODEL:
  WEIGHTS: ""
  PIXEL_MEAN: [123.675, 116.28, 103.53]
  PIXEL_STD: [58.395, 57.12, 57.375]
  BACKBONE:
    NAME: "build_swint_fpn_backbone"
  SWINT:
    OUT_FEATURES: ["stage2", "stage3", "stage4", "stage5"]
  FPN:
    IN_FEATURES: ["stage2", "stage3", "stage4", "stage5"]
INPUT:
  FORMAT: "RGB"
  # The TensorRT 8.x ROIAlign/NMS conversion path uses a static square input.
  MIN_SIZE_TEST: 1344
  MAX_SIZE_TEST: 1344
SOLVER:
  STEPS: (210000, 250000)
  MAX_ITER: 270000
  WEIGHT_DECAY: 0.05
  BASE_LR: 0.0001
  OPTIMIZER: "AdamW"
TEST:
  EVAL_PERIOD: 20000
